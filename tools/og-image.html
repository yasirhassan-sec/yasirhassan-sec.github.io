<!doctype html>
<!--
  Share-image template for writeups (1200 x 630).
  Fill it through the query string and screenshot it with a headless browser:
    ?title=…&desc=…&kicker=…&path=…&motif=chain|detect
  See README.md, "Share images", for the exact command.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share image</title>
<style>
  @font-face { font-family: "Geist"; font-weight: 100 900; font-display: block; src: url("../assets/fonts/geist-latin.woff2") format("woff2"); }
  @font-face { font-family: "Geist Mono"; font-weight: 100 900; font-display: block; src: url("../assets/fonts/geist-mono-latin.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: "Geist", sans-serif; color: #e8edf5;
    background: radial-gradient(900px 500px at 50% -10%, #13234a 0%, rgba(11, 17, 32, 0) 70%), #0b1120;
  }
  .card { position: absolute; inset: 72px 80px 64px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 600; }
  .brand img { width: 44px; height: 44px; }
  .kicker {
    margin-top: 44px; font-family: "Geist Mono", monospace; font-size: 18px; letter-spacing: .08em;
    text-transform: uppercase; color: #5b9cff;
  }
  h1 { margin-top: 16px; max-width: 700px; font-size: 56px; line-height: 1.08; font-weight: 650; letter-spacing: -.02em; }
  p { margin-top: 22px; max-width: 640px; font-size: 22px; line-height: 1.45; color: #a3afc2; }
  .foot {
    margin-top: auto; padding-top: 22px; border-top: 1px solid rgba(148, 163, 184, .2);
    display: flex; justify-content: space-between; font-family: "Geist Mono", monospace; font-size: 19px; color: #8391a9;
  }
  .foot b { color: #e8edf5; font-weight: 500; }
  .motif { position: absolute; right: 80px; top: 150px; width: 320px; height: 320px; }
  .motif svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img src="../assets/favicon.svg" alt="">Yasir Hassan</div>
  <div class="kicker" id="kicker"></div>
  <h1 id="title"></h1>
  <p id="desc"></p>
  <div class="foot"><b>yasirhassan.tech</b><span id="path"></span></div>
</div>
<div class="motif" id="motif"></div>

<!-- Hash chain: three linked blocks, the last one tampered -->
<template id="motif-chain">
  <svg viewBox="0 0 320 320" fill="none" font-family="Geist Mono, monospace" font-size="13">
    <g stroke="#34d399" stroke-width="2">
      <rect x="40" y="16" width="240" height="72" rx="12" fill="rgba(52,211,153,.06)"/>
      <rect x="40" y="124" width="240" height="72" rx="12" fill="rgba(52,211,153,.06)"/>
      <path d="M160 88v36" stroke-dasharray="4 4"/>
    </g>
    <g stroke="#f87171" stroke-width="2">
      <rect x="40" y="232" width="240" height="72" rx="12" fill="rgba(248,113,113,.08)"/>
      <path d="M160 196v36" stroke-dasharray="4 4"/>
    </g>
    <g fill="#a3afc2">
      <text x="60" y="46">block #1041</text><text x="60" y="70" fill="#34d399">hash 9f3a…c21e ✓</text>
      <text x="60" y="154">block #1042</text><text x="60" y="178" fill="#34d399">prev 9f3a…c21e ✓</text>
      <text x="60" y="262">block #1043</text><text x="60" y="286" fill="#f87171">prev 77b0…e9d4 ✗</text>
    </g>
  </svg>
</template>

<!-- Detection: camera frame with labelled boxes -->
<template id="motif-detect">
  <svg viewBox="0 0 320 320" fill="none" font-family="Geist Mono, monospace" font-size="13">
    <rect x="10" y="40" width="300" height="240" rx="14" fill="#111a2e" stroke="rgba(148,163,184,.24)" stroke-width="2"/>
    <circle cx="34" cy="62" r="5" fill="#f87171"/><text x="46" y="67" fill="#8391a9">CAM 02 · LIVE</text>
    <path d="M10 250 L90 190 L150 220 L230 160 L310 210 V266 a14 14 0 0 1 -14 14 H24 a14 14 0 0 1 -14 -14 Z" fill="#18233b"/>
    <g stroke="#fbbf24" stroke-width="2.5"><rect x="150" y="96" width="120" height="110" rx="4"/></g>
    <rect x="150" y="76" width="112" height="22" rx="3" fill="#fbbf24"/><text x="157" y="92" fill="#0b1120">smoke 0.81</text>
    <g stroke="#f87171" stroke-width="2.5"><rect x="44" y="150" width="84" height="80" rx="4"/></g>
    <rect x="44" y="130" width="92" height="22" rx="3" fill="#f87171"/><text x="51" y="146" fill="#0b1120">fire 0.87</text>
  </svg>
</template>

<script>
  const q = new URLSearchParams(location.search);
  for (const id of ['kicker', 'title', 'desc', 'path']) document.getElementById(id).textContent = q.get(id) || '';
  const motif = document.getElementById(`motif-${q.get('motif')}`);
  if (motif) document.getElementById('motif').appendChild(motif.content.cloneNode(true));
</script>
</body>
</html>
